<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Professional crypto strategy backtesting platform with real market data, Pine Script-like editor, and comprehensive analytics." />
  <title>CryptoBacktest Pro — Strategy Backtesting Platform</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'%3E%3Cpath d='M3 3v18h18V3H3zm16 16H5V5h14v14zM7 7h2v2H7V7zm4 0h2v6h-2V7zm4 0h2v10h-2V7z'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header" id="header">
      <div class="header-left">
        <div class="logo" id="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3v18h18" stroke-linecap="round"/>
            <path d="M7 16l4-6 4 4 4-8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          CryptoBacktest Pro
        </div>
        <div class="pair-selector">
          <select id="pair-select" class="input">
            <optgroup label="🔥 Top Coins">
              <option value="BTCUSDT">BTC/USDT</option>
              <option value="ETHUSDT">ETH/USDT</option>
              <option value="BNBUSDT">BNB/USDT</option>
              <option value="SOLUSDT">SOL/USDT</option>
              <option value="XRPUSDT">XRP/USDT</option>
            </optgroup>
            <optgroup label="📈 Large Cap">
              <option value="ADAUSDT">ADA/USDT</option>
              <option value="AVAXUSDT">AVAX/USDT</option>
              <option value="DOTUSDT">DOT/USDT</option>
              <option value="LINKUSDT">LINK/USDT</option>
              <option value="MATICUSDT">MATIC/USDT</option>
              <option value="NEARUSDT">NEAR/USDT</option>
              <option value="UNIUSDT">UNI/USDT</option>
              <option value="LTCUSDT">LTC/USDT</option>
              <option value="ATOMUSDT">ATOM/USDT</option>
            </optgroup>
            <optgroup label="🚀 Trending">
              <option value="SUIUSDT">SUI/USDT</option>
              <option value="ARBUSDT">ARB/USDT</option>
              <option value="OPUSDT">OP/USDT</option>
              <option value="APTUSDT">APT/USDT</option>
              <option value="INJUSDT">INJ/USDT</option>
              <option value="TIAUSDT">TIA/USDT</option>
              <option value="SEIUSDT">SEI/USDT</option>
              <option value="JUPUSDT">JUP/USDT</option>
              <option value="WIFUSDT">WIF/USDT</option>
            </optgroup>
            <optgroup label="🐕 Memecoins">
              <option value="DOGEUSDT">DOGE/USDT</option>
              <option value="SHIBUSDT">SHIB/USDT</option>
              <option value="PEPEUSDT">PEPE/USDT</option>
              <option value="FLOKIUSDT">FLOKI/USDT</option>
              <option value="BONKUSDT">BONK/USDT</option>
            </optgroup>
            <optgroup label="🏗️ DeFi / Layer 2">
              <option value="AAVEUSDT">AAVE/USDT</option>
              <option value="MKRUSDT">MKR/USDT</option>
              <option value="CRVUSDT">CRV/USDT</option>
              <option value="FETUSDT">FET/USDT</option>
              <option value="RENDERUSDT">RENDER/USDT</option>
            </optgroup>
          </select>
        </div>
        <div class="timeframe-selector">
          <div class="tabs" id="timeframe-tabs">
            <button class="tab" data-tf="1m">1m</button>
            <button class="tab" data-tf="3m">3m</button>
            <button class="tab" data-tf="5m">5m</button>
            <button class="tab" data-tf="15m">15m</button>
            <button class="tab" data-tf="30m">30m</button>
            <button class="tab active" data-tf="1h">1h</button>
            <button class="tab" data-tf="2h">2h</button>
            <button class="tab" data-tf="4h">4h</button>
            <button class="tab" data-tf="12h">12h</button>
            <button class="tab" data-tf="1d">1D</button>
            <button class="tab" data-tf="1w">1W</button>
          </div>
        </div>
      </div>
      <div class="header-controls">
        <div class="status-item">
          <span class="status-dot live"></span>
          <span id="data-status">Ready</span>
        </div>
        <button class="mobile-toggle" id="btn-toggle-sidebar" title="Strategies">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button class="mobile-toggle" id="btn-toggle-results" title="Results">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-6 4 4 4-8"/></svg>
        </button>
      </div>
    </header>

    <!-- Mobile Timeframe Bar (visible only on mobile) -->
    <div class="mobile-timeframe-bar" id="mobile-timeframe-bar" style="display: none;">
      <button class="tab" data-tf="1m">1m</button>
      <button class="tab" data-tf="3m">3m</button>
      <button class="tab" data-tf="5m">5m</button>
      <button class="tab" data-tf="15m">15m</button>
      <button class="tab" data-tf="30m">30m</button>
      <button class="tab active" data-tf="1h">1h</button>
      <button class="tab" data-tf="2h">2h</button>
      <button class="tab" data-tf="4h">4h</button>
      <button class="tab" data-tf="12h">12h</button>
      <button class="tab" data-tf="1d">1D</button>
      <button class="tab" data-tf="1w">1W</button>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="main-content">
      <!-- Mobile Overlay -->
      <div class="mobile-overlay" id="mobile-overlay"></div>
      
      <!-- Left Sidebar - Strategy Panel -->
      <aside class="sidebar" id="sidebar">
        <!-- Sidebar Tabs -->
        <div class="sidebar-tabs">
          <button class="sidebar-tab active" data-sidebar-tab="strategies">📊 Strategies</button>
          <button class="sidebar-tab" data-sidebar-tab="params">⚙️ Params</button>
          <button class="sidebar-tab" data-sidebar-tab="saved">💾 Saved</button>
        </div>

        <!-- Strategies Tab -->
        <div class="sidebar-tab-content active" id="sidebar-strategies">
          <ul class="strategy-list" id="strategy-list">
            <!-- Populated by JS -->
          </ul>
        </div>

        <!-- Parameters Tab -->
        <div class="sidebar-tab-content" id="sidebar-params">
          <div class="sidebar-section-title" style="margin-bottom: var(--sp-2);">⚙️ Strategy Parameters</div>
          <div class="params-grid" id="params-grid">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Saved Tab -->
        <div class="sidebar-tab-content" id="sidebar-saved">
          <div class="sidebar-section-title" style="margin-bottom: var(--sp-2);">💾 Custom Strategies</div>
          <div style="display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-3);">
            <button class="btn btn-sm" id="btn-save-strategy">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>
              Save
            </button>
            <button class="btn btn-sm" id="btn-load-strategy">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Load
            </button>
            <button class="btn btn-sm" id="btn-export-csv">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
              CSV
            </button>
          </div>
          <div id="saved-strategies-list"></div>
        </div>
      </aside>

      <!-- Center Panel -->
      <main class="center-panel" id="center-panel">
        
        <!-- Chart -->
        <div class="chart-container" id="chart-container">
          <div id="chart"></div>
          <div class="loading-overlay" id="chart-loading">
            <div class="loading-spinner"></div>
          </div>
        </div>

        <!-- Resize Handle -->
        <div class="resize-handle" id="resize-handle"></div>

        <!-- Code Editor -->
        <div class="editor-container" id="editor-container">
          <div class="editor-toolbar">
            <div class="editor-toolbar-left">
              <h3>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16,18 22,12 16,6"/><polyline points="8,6 2,12 8,18"/></svg>
                Strategy Editor
              </h3>
              <span class="editor-mode-badge pine" id="editor-mode-badge">PINE</span>
              <span style="font-size: var(--fs-xs); color: var(--text-muted);" id="editor-strategy-name">SMA Crossover</span>
            </div>
            <div class="editor-toolbar-right">
              <button class="btn btn-sm" id="btn-toggle-mode" title="Switch between Pine Script and JavaScript mode">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M4 4l17 17"/></svg>
                Mode
              </button>
              <button class="btn btn-sm" id="btn-copy-pine" title="Copy as Pine Script for TradingView">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                Copy Pine
              </button>
              <button class="btn btn-primary btn-sm" id="btn-run-backtest">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
                Run Backtest
              </button>
            </div>
          </div>
          <div class="editor-wrapper" id="editor-wrapper">
            <!-- CodeMirror mounts here -->
          </div>
        </div>
      </main>

      <!-- Right Panel - Results -->
      <aside class="results-panel" id="results-panel">
        <div class="results-tabs">
          <div class="tabs" id="results-tabs">
            <button class="tab active" data-tab="overview">Overview</button>
            <button class="tab" data-tab="trades">Trades</button>
            <button class="tab" data-tab="equity">Equity</button>
          </div>
        </div>
        <div class="results-content" id="results-content">
          <div class="empty-state" id="results-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 3v18h18"/>
              <path d="M7 16l4-6 4 4 4-8"/>
            </svg>
            <p>Run a backtest to see results</p>
            <p style="margin-top: var(--sp-2); font-size: var(--fs-xs);">Select a strategy and click "Run Backtest"</p>
          </div>
          
          <!-- Overview Tab -->
          <div id="tab-overview" class="tab-content" style="display: none;">
            <div class="metrics-grid" id="metrics-grid"></div>
            <div class="equity-chart-container" id="mini-equity-chart"></div>
            <div style="margin-top: var(--sp-2);">
              <div class="sidebar-section-title" style="margin-bottom: var(--sp-2);">Summary</div>
              <div id="summary-text" style="font-size: var(--fs-xs); color: var(--text-secondary); line-height: 1.6;"></div>
            </div>
          </div>

          <!-- Trades Tab -->
          <div id="tab-trades" class="tab-content" style="display: none;">
            <div class="trade-log" id="trade-log">
              <table class="data-table" id="trades-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Type</th>
                    <th>Entry</th>
                    <th>Exit</th>
                    <th>P&L</th>
                  </tr>
                </thead>
                <tbody id="trades-tbody"></tbody>
              </table>
            </div>
          </div>

          <!-- Equity Tab -->
          <div id="tab-equity" class="tab-content" style="display: none;">
            <div id="equity-chart-full" style="height: 250px; border: 1px solid var(--border-secondary); border-radius: var(--radius-md); overflow: hidden; margin-bottom: var(--sp-4);"></div>
            <div id="drawdown-chart" style="height: 150px; border: 1px solid var(--border-secondary); border-radius: var(--radius-md); overflow: hidden;">
            </div>
            <div class="sidebar-section-title" style="margin-top: var(--sp-3); margin-bottom: var(--sp-2);">Drawdown Chart</div>
          </div>
        </div>
      </aside>
    </div>

    <!-- Status Bar -->
    <footer class="status-bar" id="status-bar">
      <div class="status-bar-left">
        <span class="status-item" id="status-pair">BTC/USDT</span>
        <span class="status-item" id="status-timeframe">1h</span>
        <span class="status-item" id="status-candles">— candles</span>
      </div>
      <div class="status-bar-right">
        <span class="status-item" id="status-backtest">No backtest run</span>
        <span class="status-item">CryptoBacktest Pro v1.0</span>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
